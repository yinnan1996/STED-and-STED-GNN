[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sted-reference"
version = "0.1.0"
description = "Reference implementations of STED and STED-GNN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "torch>=2.1",
  "torch-geometric>=2.5",
  "transformers>=4.41,<5",
]

[tool.setuptools.packages.find]
include = ["sted*", "sted_gnn*", "training*"]
